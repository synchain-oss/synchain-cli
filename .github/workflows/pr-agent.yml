name: PR Agent

# Qodo PR-Agent —— DeepSeek,按量计费。只在 base = dev 的 PR 上运行(PR → dev 的每次 push 都会复审);
# 子 PR(base = feature/*)不跑,子 PR 上由 claude-review / deepseek-review 审查。
# 容器化(Docker container)action:slim runner 无 docker daemon,build 阶段会在 /var/run/docker.sock 上失败。
# fork PR 一律不跑:pull_request 事件不向 fork 下发 secrets。
# 成本提醒:建议先 gh workflow disable,等观察到 claude-review 的盲区再开。
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    # 只在 base = dev 的 PR 上跑。用 job 级 if 判断 base,而不是 on.pull_request.branches ——
    # 被触发器过滤掉的 PR 不产生 check run,若分支保护把本 workflow 列为必需检查,PR 会一直停在
    # 等待状态;job 被 if 跳过时报告为 skipped,满足必需检查。本仓 feature/extraction 目前无分支
    # 保护,但一旦将来把 pr-agent 列为必需检查,触发器级过滤就会让 PR 永远停在等待状态 —— 所以
    # 现在就按 job 级写,与同款仓库保持一致。
    if: >
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest            # 容器 action,slim 无 docker daemon 会挂
    timeout-minutes: 30
    permissions:
      contents: read                  # checkout 需要读权限拉取 PR merge ref
      issues: write                   # 故意不给 contents: write —— 收窄爆炸半径
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 1 }
      - uses: qodo-ai/pr-agent@8e4d32e5497defd43c023a404f73560c62728961   # v0.39.0 —— pin 到 commit SHA,升级手动改
        env:
          # ANTHROPIC.KEY / ANTHROPIC.API_BASE 是 pr-agent 专属的点号配置项:
          # pr-agent 会显式用自己 settings 里的 api_key 覆盖原始 litellm 环境变量,
          # 只设 ANTHROPIC_API_KEY 会被空值覆盖,导致网关返回 "api key invalid"。
          ANTHROPIC.KEY: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
          ANTHROPIC.API_BASE: https://opencode.ai/zen/go
          # 以下两项是 litellm 兜底(双保险,缺一会返回 "api key invalid")
          ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
          ANTHROPIC_API_BASE: https://opencode.ai/zen/go
          # OpenCode Go 强制要求会话头,缺失会直接返回 MissingSessionID。pr-agent 的 litellm 调用
          # 不会自带这个头,所以走 pr-agent v0.39.0 支持的 LITELLM.EXTRA_HEADERS(JSON 对象),
          # 它会被塞进 litellm 的 extra_headers 传下去。
          LITELLM.EXTRA_HEADERS: '{"x-opencode-session": "pr-agent-${{ github.run_id }}-${{ github.run_attempt }}"}'
          # ── 输出上限的真正开关 ── pr-agent v0.39.0 里并没有 config.max_output_tokens 这个键
          # (该键是上游后来才加的,写在配置里在这里是空操作),所以请求不带 max_tokens;
          # 此时 litellm 的 Anthropic 适配器回落到 DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS,默认只有 4096,
          # 带推理的模型会把它全用在 reasoning 上 → "Empty content in model response"、审查空跑但 job 报绿。
          # 这个环境变量就是 litellm 那个默认值的开关,必须显式抬高(网关实测 max_tokens 上限 393216)。
          # 出处(可核对):pr-agent v0.39.0 的 requirements.txt 钉 litellm==1.84.0。该版
          # litellm/llms/anthropic/chat/transformation.py:162-182 在请求不带 max_tokens 时调用
          # get_max_tokens_for_model();本模型 id 不在其内置表里 → 落到 constants.py:413 的
          # DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS(默认 4096)。pr-agent 侧全文件唯一设置 max_tokens
          # 的地方是 litellm_ai_handler.py:351,只在 enable_claude_extended_thinking=true 时执行
          # (configuration.toml:68 默认 false,本仓未开)。
          DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS: "131072"
          GITHUB.USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # pr-agent action 入口读标准 GITHUB_TOKEN env(实测补)
          # 模型:2026-10-18 从 DeepSeek 直连迁到 OpenCode Go。该网关只认裸 id,
          # "deepseek-v4.1-flash[1M]" 会返回 {"message":"Model is unavailable."};"[1M]" 是上下文标注、
          # 不是 id 的一部分,而这个 id 本身就是 1M 上下文(实测约 96 万 token 输入通过、约 107 万被拒)。
          config.model: anthropic/deepseek-v4.1-flash
          config.fallback_models: anthropic/deepseek-v4-pro
          # 下面三项对 fallback 模型同样生效:pr-agent 不会为 fallback 重新夹取窗口。主模型与
          # fallback 的输出上限都已实测为 393216(网关级限制,超出返回 HTTP 500),但 fallback
          # deepseek-v4-pro 的**上下文窗口**未经实测,故超大 PR 落到 fallback 时可能被拒 —— 那是
          # 显式失败(job 报红),不是静默空跑,可以接受;若确认窗口更小,把三项按窗口收窄。
          config.custom_model_max_tokens: 1000000   # 1M 档;换成不带 1M 上下文的 id 时改回 131072
          config.max_model_tokens: 800000           # 输入输出共用 1M 上下文,留出 131072+ 给输出;换 131072 档时三项要一起改,且输入+输出须小于窗口并留余量,如 131072 / 90112 / 32768
          config.max_output_tokens: "131072"        # 注意:v0.39.0 里没有这个键,本版是空操作;真正生效的是上面新加的 DEFAULT_ANTHROPIC_CHAT_MAX_TOKENS(默认只发 4096,带推理会被吃光导致空审查)。保留以便升级 pin 后接上
          config.ai_timeout: 300 # 默认 120s;输出上限抬到 131072 且带推理后,大 PR 单次生成可能超过 120s,超时同样是「不出内容而 job 报绿」
          # 必须显式含 "synchronize",否则 push 更新 PR 不复审(action runner 源码默认不处理 synchronize)
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.enable_output_relevant: "true"
