name: PR Agent

# pr-agent（describe / review / improve），DeepSeek V4.1 Flash 经 OpenCode Go，按量计费。
# 只在 PR → dev 上跑，PR 每次 push 都重跑。
# 模型、上限、超时、锁定的 pr-agent 镜像都在 Synchain-oss/ci-workflows 的 pr-agent.yml 里统一维护；
# 这里只放本仓专属的 ignore 列表。

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  pr-agent:
    permissions:
      contents: read        # pr-agent 要读 PR 文件与 .pr_agent.toml
      issues: write
      pull-requests: write
    uses: Synchain-oss/ci-workflows/.github/workflows/pr-agent.yml@62556ec3f2b4e049c5b099ebd9c56c4a2888a0a9 # v1.1.0
    with:
      provider: opencode-go
      ignore_globs: '["package-lock.json","LICENSES/*"]'
    secrets:
      api_key: ${{ secrets.OPENCODE_GO_API_KEY_FOR_REVIEW }}
