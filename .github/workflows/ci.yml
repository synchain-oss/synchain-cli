name: CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # 本 workflow 不读任何 secrets → fork PR 可安全运行

jobs:
  # 矩阵 = 三格:ubuntu-latest × node 20/22 + windows-latest × node 20
  checks:
    name: checks (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22']              # engines: >=20
        include:
          - os: windows-latest          # CLI 有路径/文件名处理逻辑,必须验 Windows
            node: '20'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      # --ignore-scripts:npm ci 默认执行依赖的 install script 与本包自己的 lifecycle
      # script。本项目的构建(tsc)与测试(vitest)都不依赖它们,实测去掉后全绿。
      # 它买到的是依赖侧的收窄 —— lockfile 里被投毒的包不再能在 runner 上执行代码;
      # 这一条在 same-repo 的 push 路径上同样生效,而那条路径没有 fork 审批兜底。
      # 它买不到的是「挡住恶意 fork PR」:pull_request 下 workflow 定义取自 PR head,
      # 作者本来就能直接加一个 run: 步骤。那层防线在仓库设置里(fork PR 审批),不在这里。
      - run: npm ci --ignore-scripts
      - run: npm run typecheck          # tsc --noEmit(覆盖测试文件)
      - run: npm run test -- --coverage # vitest run + 覆盖率阈值(见 vitest.config.mts)
      - run: npm run build              # tsc -p tsconfig.build.json → dist/

  # smoke:打包内容与入口冒烟(无 needs、node 20)
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts && npm run build   # --ignore-scripts 理由见 checks
      - name: Verify package contents
        run: npm pack --dry-run         # 确认 dist/ 与 bin 入口在包里、不误打包 src/__tests__
      - name: Smoke test built CLI
        run: |
          node dist/index.js --help > /tmp/h1.txt
          node dist/index.js help   > /tmp/h2.txt
          grep -q 'github.com/synchain-oss/synchain-cli' /tmp/h1.txt
          grep -q 'github.com/synchain-oss/synchain-cli' /tmp/h2.txt
          ! grep -q 'DLsnows' /tmp/h1.txt
          ! grep -q 'DLsnows' /tmp/h2.txt

  # no-stale-refs:抽取期遗留引用的四条 grep,作为持续约束
  # 四条例外:
  #   ① CHANGELOG.md 排除(其职责就是叙述历史,必然出现旧串)
  #   ② cd cli 用行首锚定 ^[[:space:]]*cd cli\b(只命中命令行,不误伤散文)
  #   ③ 排除 .github/workflows/**:本 job 的三个模式串字面量就写在这个文件里,
  #      若不排除,git grep 会命中 ci.yml 自身 → 永久红(检测器的自引用,不是陈旧引用)
  #   ④ 排除 docs/contract-changes/**:冻结契约变更文档叙述历史(记录旧仓路径),与 CHANGELOG 同性质
  no-stale-refs:
    name: no-stale-refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - run: |
          bad=0
          for p in 'DLsnows/Synchain' 'UNLICENSED' 'docs/cli/'; do
            if git grep -nI -- "$p" -- ':!CHANGELOG.md' ':!.github/workflows/**' ':!docs/contract-changes/**' >/dev/null 2>&1; then
              echo "::error::残留引用命中:$p"; git grep -nI -- "$p" -- ':!CHANGELOG.md' ':!.github/workflows/**' ':!docs/contract-changes/**'; bad=1
            fi
          done
          # `cd cli`:行首锚定 + 排除 CHANGELOG / 生成物目录
          if grep -rnE '^[[:space:]]*cd cli\b' . \
               --exclude=CHANGELOG.md --exclude-dir=.git \
               --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=contract-changes >/dev/null 2>&1; then
            echo "::error::残留引用命中:cd cli(命令行形式)"
            grep -rnE '^[[:space:]]*cd cli\b' . --exclude=CHANGELOG.md --exclude-dir=.git \
                 --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=contract-changes
            bad=1
          fi
          exit $bad

  # audit:供应链门禁,单独成 job,但必须进 cli-gate.needs
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts    # --ignore-scripts 理由见 checks
      - run: npm audit --audit-level=high

  # compliance:gitleaks(工作树)+ reuse lint。
  # 不进 npm run gates 字符串;无 secrets → fork PR 同样跑。
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: ./.github/actions/setup-gitleaks
      - name: Secret scan (working tree)
        run: gitleaks detect --no-git --source . --redact -v --config .gitleaks.toml
      - name: REUSE lint
        run: pipx run reuse lint

  # secret-history:扫 git 历史。compliance 那条带 --no-git,只看工作树 —— 一条推上来
  # 又被后续 commit 删掉的凭据,在那里是看不见的。两条覆盖面不同,都要有。
  # 覆盖面口径:gitleaks 不带 --log-opts 时扫的是 HEAD 可达的祖先(PR 上 = dev 主干线 + 本 PR),
  # 不是所有 remote ref。覆盖全部 ref 的一次性扫描放在翻公开前手工做(理由见
  # docs/PUBLIC_LAUNCH_SETTINGS.md):写进 CI 会让一条从不打算合并的旁支上的命中变成常红门禁。
  # 红了只代表历史里有命中,处置(登记 allowlist / 轮换凭据 / 改写历史)是人的判断,不在本 job 里做。
  secret-history:
    name: secret-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 0 }        # 默认浅克隆只有 1 个 commit,扫历史必须要完整 clone
      - uses: ./.github/actions/setup-gitleaks
      - name: Secret scan (git history)
        run: gitleaks detect --redact -v --config .gitleaks.toml

  # 聚合 job:required check 只挂这一个;needs 必须列全其余各项,否则其它 job 红了照样能 merge
  cli-gate:
    name: cli-gate
    needs: [checks, smoke, no-stale-refs, audit, compliance, secret-history]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in "${{ needs.checks.result }}" "${{ needs.smoke.result }}" \
                   "${{ needs.no-stale-refs.result }}" "${{ needs.audit.result }}" \
                   "${{ needs.compliance.result }}" "${{ needs.secret-history.result }}"; do
            echo "result: $r"
            [ "$r" = "success" ] || exit 1
          done
