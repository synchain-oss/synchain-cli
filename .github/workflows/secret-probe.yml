name: Secret Probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe org secrets availability
        env:
          DSK: ${{ secrets.DEEPSEEK_KEY }}
          CCOT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "DSK_LEN=${#DSK}"
          echo "CCOT_LEN=${#CCOT}"
