name: 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["type/feat"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 问题场景
      description: 你现在想做什么,为什么做不到
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案(可选)
